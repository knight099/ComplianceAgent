name: Access policy parity
on:
  pull_request:
    paths: ['policies/**', 'relay/opa-bundles.yaml', 'relay/access-report.mjs', 'app/api/v1/policy-bundles/**', 'lib/policy-bundle.mjs', 'scripts/sign-policy-bundle.mjs', 'tests/signed-policy.test.mjs', 'lib/opa-access-review.mjs', 'lib/access-review-contract.mjs', 'tests/opa-access-review.test.mjs', '.github/workflows/access-policy.yml']
  push:
    branches: [main]
    paths: ['policies/**', 'relay/opa-bundles.yaml', 'relay/access-report.mjs', 'app/api/v1/policy-bundles/**', 'lib/policy-bundle.mjs', 'scripts/sign-policy-bundle.mjs', 'tests/signed-policy.test.mjs', 'lib/opa-access-review.mjs', 'lib/access-review-contract.mjs', 'tests/opa-access-review.test.mjs', '.github/workflows/access-policy.yml']
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Evaluate access outcomes with OPA 1.4.2
        env:
          TEST_OPA_ORIGIN: http://127.0.0.1:8181
        run: |
          curl -fsSLo "$RUNNER_TEMP/opa" https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static
          echo "2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod 700 "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" check --strict policies/access-review/v1
          "$RUNNER_TEMP/opa" run --server --addr=127.0.0.1:8181 policies/access-review/v1/policy.rego &
          pid=$!
          trap 'kill "$pid"' EXIT
          curl -fsS --retry 10 --retry-connrefused "$TEST_OPA_ORIGIN/health"
          OPA_BIN="$RUNNER_TEMP/opa" node --test tests/opa-access-review.test.mjs tests/signed-policy.test.mjs
