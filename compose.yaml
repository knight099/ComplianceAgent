services:
  migrate:
    build: .
    environment:
      DATABASE_URL: postgres://complyos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/complyos
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD}
    command: ["node", "scripts/migrate.mjs", "--provision-runtime"]
    depends_on:
      db: {condition: service_healthy}
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgres://complyos_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db/complyos
      AUTH_MODE: ${AUTH_MODE:-shared}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-}
      AI_MODELS: ${AI_MODELS:-}
      AI_TENANT_PROVIDERS: ${AI_TENANT_PROVIDERS:-}
      AI_ENDPOINTS: ${AI_ENDPOINTS:-}
      RELAY_TOKEN: ${RELAY_TOKEN:-}
      DEVICE_KEYS_FILE: /app/.data/devices.json
    volumes: ["evidence:/app/.data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  collection-monitor:
    build: .
    environment:
      COMPLYOS_MONITOR_ORGANIZATION: ${COMPLYOS_MONITOR_ORGANIZATION:-installation}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      DATABASE_URL: postgres://complyos_worker:${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD}@db/complyos
    command: ["node", "scripts/collection-monitor.mjs"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: complyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyos"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes: ["postgres:/var/lib/postgresql/data"]

volumes:
  postgres:
  evidence:
